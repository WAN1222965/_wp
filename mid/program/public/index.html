<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨 - 極簡隨筆</title>
    <link rel="alternate" type="application/rss+xml" title="墨 - 網誌 RSS" href="/s111410509/rss.xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
    <link rel="stylesheet" href="/s111410509/style.css">
</head>
<body>
    <canvas id="inkCanvas"></canvas>

    <div class="main-container">
        <header>
            <h1>墨</h1>
            <p class="subtitle">紀錄瞬間的思緒</p>
            <div style="margin-top:12px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">
                <button onclick="toggleThemeFront()" id="themeBtnFront" class="game-link" style="border:none;background:none;cursor:pointer;font-size:0.9rem;">🌙 深色</button>
                <a href="/s111410509/rss.xml" class="game-link" target="_blank">📡 RSS</a>
            </div>
            <nav class="nav-links" style="margin-top:12px;">
                <a href="/s111410509/" class="game-link">📝 網誌</a>
                <a href="/s111410509/snake.html" class="game-link">🐍 貪吃蛇</a>
                <a href="/s111410509/whack.html" class="game-link">🎯 捕墨</a>
                <a href="/s111410509/maze.html" class="game-link">🏃 墨陣</a>
                <a href="/s111410509/leaderboard.html" class="game-link">🏆 排行</a>
                <a href="/s111410509/news.html" class="game-link">📰 新聞</a>
            </nav>
            <div class="user-section" id="userSection">
                <a href="/s111410509/login.html" class="game-link" id="loginLink">登入</a>
            </div>
        </header>



        <section class="input-area">
            <textarea id="noteInput" placeholder="在此研墨，書寫心情..."></textarea>
            <button onclick="addNote()">落筆</button>
        </section>

        <section id="notesList" class="notes-list">
        </section>
    </div>

    <script src="/s111410509/ink_background.js"></script>
    <script src="/s111410509/script.js"></script>
    <script>
        function getSystemTheme() { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        function applyFrontTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            const btn = document.getElementById('themeBtnFront');
            if (btn) btn.textContent = t === 'dark' ? '☀️ 淺色' : '🌙 深色';
        }
        window.toggleThemeFront = function() {
            const c = document.documentElement.getAttribute('data-theme');
            applyFrontTheme(c === 'dark' ? 'light' : 'dark');
            if (window.inkBg && window.inkBg.updateTheme) window.inkBg.updateTheme();
        };
        applyFrontTheme(localStorage.getItem('theme') || getSystemTheme());
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) applyFrontTheme(e.matches ? 'dark' : 'light');
        });
    </script>
</body>
</html>
