<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨 - 極簡隨筆</title>
    <link rel="alternate" type="application/rss+xml" title="墨 - 網誌 RSS" id="rssLink">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap">
    <link rel="stylesheet" id="cssLink">
</head>
<body>
    <canvas id="inkCanvas"></canvas>

    <div class="main-container">
        <header>
            <h1>墨</h1>
            <p class="subtitle">紀錄瞬間的思緒</p>
            
            <nav class="nav-links" id="notesNav">
                <a href="" class="nav-pill">📝 網誌</a>
                <div class="dropdown-wrapper">
                    <a href="#" onclick="toggleGames(event)" class="nav-pill dropdown-toggle">🎮 互動專案 <span class="arrow">▾</span></a>
                    <div class="dropdown-content" id="gamesDropdown">
                        <a href="" class="nav-pill dropdown-item">🐍 貪吃蛇</a>
                        <a href="" class="nav-pill dropdown-item">🎯 捕墨</a>
                        <a href="" class="nav-pill dropdown-item">🏃 墨陣</a>
                        <a href="" class="nav-pill dropdown-item">🏆 排行</a>
                    </div>
                </div>
                <a href="" class="nav-pill">📰 新聞</a>
                <a href="" class="nav-pill" target="_blank">📡 RSS</a>
            </nav>

            <div style="margin-top: 16px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button onclick="toggleThemeFront()" id="themeBtnFront" class="theme-toggle">🌙 深色</button>
            </div>

            <div class="user-section" id="userSection">
                <a href="" class="nav-pill" id="loginLink">登入</a>
            </div>
        </header>

        <section class="input-area">
            <div class="input-wrapper">
                <textarea id="noteInput" placeholder="在此研墨，書寫心情..."></textarea>
                <div class="input-actions">
                    <button onclick="addNote()">落筆</button>
                </div>
            </div>
        </section>

        <section id="notesList" class="notes-list">
        </section>
    </div>

    <script>
        const BASE = window.location.pathname.replace(/\/notes.*$/, '') || '/s111410509';
        document.getElementById('rssLink').href = BASE + '/rss.xml';
        document.getElementById('cssLink').href = BASE + '/style.css';
        const navLinks = ['', 'news.html', 'rss.xml'];
        document.querySelectorAll('#notesNav > a.nav-pill').forEach((a, i) => { a.href = BASE + '/' + navLinks[i]; });
        const gamePaths = ['snake.html', 'whack.html', 'maze.html', 'leaderboard.html'];
        document.querySelectorAll('#gamesDropdown a').forEach((a, i) => { a.href = BASE + '/' + gamePaths[i]; });
        document.getElementById('loginLink').href = BASE + '/login.html';
        function toggleGames(e) {
            e.preventDefault();
            document.getElementById('gamesDropdown').classList.toggle('show');
        }
        document.addEventListener('click', function(e) {
            const dd = document.getElementById('gamesDropdown');
            if (dd.classList.contains('show') && !e.target.closest('.dropdown-wrapper')) {
                dd.classList.remove('show');
            }
        });
    </script>
    <script>
        function loadScript(url) {
            var s = document.createElement('script');
            s.src = url;
            document.body.appendChild(s);
        }
        loadScript(BASE + '/ink_background.js');
        loadScript(BASE + '/script.js');

        function getSystemTheme() { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        function applyFrontTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            const btn = document.getElementById('themeBtnFront');
            if (btn) btn.textContent = t === 'dark' ? '☀️ 淺色' : '🌙 深色';
        }
        window.toggleThemeFront = function() {
            const c = document.documentElement.getAttribute('data-theme');
            applyFrontTheme(c === 'dark' ? 'light' : 'dark');
            if (window.inkBg && window.inkBg.updateTheme) window.inkBg.updateTheme();
        };
        applyFrontTheme(localStorage.getItem('theme') || getSystemTheme());
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('theme')) applyFrontTheme(e.matches ? 'dark' : 'light');
        });
    </script>
</body>
</html>
