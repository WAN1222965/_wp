<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>捕墨 - 墨跡反應挑戰</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap">
    <link rel="stylesheet" href="/s111410509/style.css">
    <style>
        .game-container { text-align: center; z-index: 1; position: relative; }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-gap: 20px;
            justify-content: center;
            margin: 30px auto;
        }
        .hole {
            width: 120px;
            height: 120px;
            background: #e0ddd5;
            border-radius: 50%;
            border: 4px solid #333;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .ink-blot {
            width: 80%;
            height: 80%;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 110%;
            left: 10%;
            transition: top 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: blur(2px);
        }
        .hole.up .ink-blot { top: 10%; }

        .splashed { animation: splash 0.3s forwards; }
        @keyframes splash {
            to { transform: scale(1.5); opacity: 0; filter: blur(10px); }
        }

        .stats { font-size: 1.5rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <canvas id="inkCanvas"></canvas>
    <div class="main-container game-container">
        <header>
            <h1>捕墨</h1>
            <div class="stats">
                得分：<span id="score">0</span> | 剩餘時間：<span id="timeLeft">30</span>s
            </div>
            <button id="startBtn" onclick="startGame()">開始研墨</button>
        </header>

        <div class="grid">
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
            <div class="hole"><div class="ink-blot"></div></div>
        </div>

        <a href="/s111410509/notes" class="back-link">返回隨筆</a>
    </div>

    <script src="/s111410509/ink_background.js"></script>
    <script src="/s111410509/whack.js"></script>
</body>
</html>
