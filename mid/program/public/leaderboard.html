<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨 - 排行榜</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap">
    <link rel="stylesheet" id="cssLink">
</head>
<body>
    <canvas id="inkCanvas"></canvas>
    <div class="main-container">
        <header>
            <h1>墨</h1>
            <p class="subtitle">排行榜</p>
            <div style="margin-top: 16px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                <button onclick="toggleTheme()" id="themeBtn" class="theme-toggle">🌙 深色</button>
            </div>
            <nav class="nav-links" id="leaderNav">
                <a href="" class="nav-pill">📝 網誌</a>
                <a href="" class="nav-pill">🐍 貪吃蛇</a>
                <a href="" class="nav-pill">🎯 捕墨</a>
                <a href="" class="nav-pill">🏃 墨陣</a>
                <a href="" class="nav-pill">📰 新聞</a>
            </nav>
        </header>

        <div class="leaderboard">
            <h2>墨跡排行</h2>
            <div id="scoresList"></div>
        </div>

        <a href="" class="back-link" id="backLink">開始遊戲 →</a>
    </div>
    <script>
        const BASE = window.location.pathname.replace(/\/leaderboard.*$/, '') || '/s111410509';
        document.getElementById('cssLink').href = BASE + '/style.css';
        const navPaths = ['', 'snake.html', 'whack.html', 'maze.html', 'news.html'];
        document.querySelectorAll('#leaderNav a').forEach((a, i) => { a.href = BASE + '/' + navPaths[i]; });
        document.getElementById('backLink').href = BASE + '/snake.html';
    </script>
    <script>
        function loadScript(url) {
            var s = document.createElement('script');
            s.src = url;
            document.body.appendChild(s);
        }
        if (document.getElementById('inkCanvas')) loadScript(BASE + '/ink_background.js');
    </script>
    <script>
        document.getElementById('inkScript').src = BASE + '/ink_background.js';

        (function() {
            const t = localStorage.getItem('theme');
            const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t || sys);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = (t || sys) === 'dark' ? '☀️ 淺色' : '🌙 深色';
        })();
        window.toggleTheme = function() {
            const c = document.documentElement.getAttribute('data-theme');
            const t = c === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = t === 'dark' ? '☀️ 淺色' : '🌙 深色';
            if (window.inkBg && window.inkBg.updateTheme) window.inkBg.updateTheme();
        };

        async function loadScores() {
            const response = await fetch(BASE + '/api/scores');
            const scores = await response.json();
            const list = document.getElementById('scoresList');
            
            if (scores.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:20px;">尚無紀錄</p>';
                return;
            }
            
            list.innerHTML = scores.map((s, i) => `
                <div class="score-item">
                    <span class="score-rank">${i + 1}</span>
                    <span class="score-name">${s.name}</span>
                    <span class="score-value">${s.score} 分</span>
                    <span class="score-date">${s.date}</span>
                </div>
            `).join('');
        }
        loadScores();
    </script>
</body>
</html>
