<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時事新聞 - 墨</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 40px 0;
        }
        header h1 {
            font-size: 2.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        header a {
            color: #a0c4ff;
            text-decoration: none;
            font-size: 0.9em;
            display: inline-block;
            margin-top: 10px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .tab-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }
        .tab-btn:hover, .tab-btn.active {
            background: rgba(160, 196, 255, 0.3);
            border-color: #a0c4ff;
        }
        .news-section { display: none; }
        .news-section.active { display: block; }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .news-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .news-card h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #a0c4ff;
            line-height: 1.4;
        }
        .news-card h3 a {
            color: inherit;
            text-decoration: none;
        }
        .news-card h3 a:hover { text-decoration: underline; }
        .news-meta {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 10px;
        }
        .news-card p {
            font-size: 0.95em;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .news-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .like-btn {
            background: rgba(255,100,100,0.2);
            border: 1px solid rgba(255,100,100,0.4);
            color: #ff6b6b;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
        }
        .like-btn:hover { background: rgba(255,100,100,0.4); }
        .like-btn.liked { background: #ff6b6b; color: #fff; }
        .source-tag {
            background: rgba(160, 196, 255, 0.2);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            color: #a0c4ff;
        }
        .loading { text-align: center; padding: 50px; color: #888; }
        .error { text-align: center; padding: 50px; color: #ff6b6b; }
        .comment-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .comment-form {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .comment-form input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            color: #fff;
            font-size: 0.85em;
        }
        .comment-form input::placeholder { color: #666; }
        .comment-form button {
            padding: 8px 15px;
            background: rgba(160, 196, 255, 0.3);
            border: 1px solid rgba(160, 196, 255, 0.5);
            border-radius: 20px;
            color: #a0c4ff;
            cursor: pointer;
            font-family: inherit;
        }
        .comment-form button:hover { background: rgba(160, 196, 255, 0.5); }
        .comments-list { font-size: 0.85em; color: #aaa; }
        .comment-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-user { color: #a0c4ff; font-weight: bold; }
        .comment-time { color: #666; font-size: 0.8em; margin-left: 10px; }
        @media (max-width: 768px) {
            .news-grid { grid-template-columns: 1fr; }
            .tabs { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>時事新聞</h1>
            <a href="/s111410509/notes">← 返回網誌</a>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('taiwan', this)">台灣新聞</button>
            <button class="tab-btn" onclick="switchTab('world', this)">國際新聞</button>
        </div>

        <div id="taiwan-section" class="news-section active">
            <div id="taiwan-news" class="news-grid">
                <div class="loading">載入中...</div>
            </div>
        </div>

        <div id="world-section" class="news-section">
            <div id="world-news" class="news-grid">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>

    <script>
        let newsLikes = {};

        async function loadLikes() {
            try {
                const res = await fetch('/s111410509/api/news/likes');
                const likes = await res.json();
                likes.forEach(item => {
                    newsLikes[item.news_title] = item.likes;
                });
            } catch (e) { console.error('載入按讚失敗', e); }
        }

        async function loadTaiwanNews() {
            const container = document.getElementById('taiwan-news');
            try {
                const res = await fetch('/s111410509/api/news/taiwan');
                const feeds = await res.json();
                container.innerHTML = '';
                
                feeds.forEach(feed => {
                    if (feed.articles.length === 0) return;
                    
                    feed.articles.forEach(article => {
                        const card = createNewsCard(article, feed.source);
                        container.appendChild(card);
                    });
                });

                if (container.children.length === 0) {
                    container.innerHTML = '<div class="error">暫時無法載入新聞，請稍後再試</div>';
                }
            } catch (e) {
                container.innerHTML = '<div class="error">載入失敗: ' + e.message + '</div>';
            }
        }

        async function loadWorldNews() {
            const container = document.getElementById('world-news');
            try {
                const res = await fetch('/s111410509/api/news/world');
                const data = await res.json();
                container.innerHTML = '';
                
                if (data.articles.length === 0) {
                    container.innerHTML = '<div class="error">請設定 NewsAPI Key 以取得國際新聞</div>';
                    return;
                }

                data.articles.forEach(article => {
                    const card = createNewsCard(article, data.source);
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<div class="error">載入失敗: ' + e.message + '</div>';
            }
        }

        function createNewsCard(article, source) {
            const card = document.createElement('div');
            card.className = 'news-card';
            
            const likes = newsLikes[article.title] || 0;
            const likedClass = likes > 0 ? 'liked' : '';
            
            card.innerHTML = `
                <h3><a href="${article.link}" target="_blank">${article.title}</a></h3>
                <div class="news-meta">
                    <span class="source-tag">${source}</span>
                    ${article.pubDate ? ' • ' + new Date(article.pubDate).toLocaleDateString('zh-TW') : ''}
                </div>
                ${article.description ? `<p>${article.description.substring(0, 150)}...</p>` : ''}
                <div class="news-actions">
                    <button class="like-btn ${likedClass}" onclick="toggleLike(this, '${encodeURIComponent(article.title)}', '${article.link}')">
                        ♡ <span class="like-count">${likes}</span>
                    </button>
                    <button class="like-btn" onclick="toggleComments(this, '${encodeURIComponent(article.title)}', '${article.link}')" style="background: rgba(160, 196, 255, 0.2); border-color: rgba(160, 196, 255, 0.4); color: #a0c4ff;">
                        💬 <span class="comment-count">0</span>
                    </button>
                </div>
                <div class="comment-section" style="display:none;">
                    <div class="comment-form">
                        <input type="text" placeholder="暱稱" class="comment-username">
                        <input type="text" placeholder="留言..." class="comment-input">
                        <button onclick="addComment(this, '${encodeURIComponent(article.title)}', '${article.link}')">發送</button>
                    </div>
                    <div class="comments-list"></div>
                </div>
            `;
            return card;
        }

        async function toggleLike(btn, encodedTitle, link) {
            const title = decodeURIComponent(encodedTitle);
            
            try {
                const res = await fetch('/s111410509/api/news/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, link })
                });
                const data = await res.json();
                
                btn.classList.add('liked');
                btn.querySelector('.like-count').textContent = data.likes;
                newsLikes[title] = data.likes;
            } catch (e) {
                alert('按讚失敗');
            }
        }

        async function toggleComments(btn, encodedTitle, link) {
            const card = btn.closest('.news-card');
            const commentSection = card.querySelector('.comment-section');
            const title = decodeURIComponent(encodedTitle);
            
            if (commentSection.style.display === 'none') {
                commentSection.style.display = 'block';
                await loadComments(card, title, link);
            } else {
                commentSection.style.display = 'none';
            }
        }

        async function loadComments(card, title, link) {
            const list = card.querySelector('.comments-list');
            const countSpan = card.querySelector('.comment-count');
            
            try {
                const res = await fetch('/s111410509/api/news/comments?title=' + encodeURIComponent(title));
                const comments = await res.json();
                
                countSpan.textContent = comments.length;
                list.innerHTML = comments.map(c => `
                    <div class="comment-item">
                        <span class="comment-user">${c.username}</span>
                        <span class="comment-time">${new Date(c.created_at).toLocaleDateString('zh-TW')}</span>
                        <div>${c.content}</div>
                    </div>
                `).join('');
                
                if (comments.length === 0) {
                    list.innerHTML = '<div style="color:#666;">尚無留言</div>';
                }
            } catch (e) {
                list.innerHTML = '<div style="color:#ff6b6b;">載入失敗</div>';
            }
        }

        async function addComment(btn, encodedTitle, link) {
            const card = btn.closest('.news-card');
            const usernameInput = card.querySelector('.comment-username');
            const contentInput = card.querySelector('.comment-input');
            const title = decodeURIComponent(encodedTitle);
            const username = usernameInput.value.trim();
            const content = contentInput.value.trim();
            
            if (!username || !content) {
                alert('請填寫暱稱和留言內容');
                return;
            }
            
            try {
                const res = await fetch('/s111410509/api/news/comment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, link, username, content })
                });
                
                if (res.ok) {
                    contentInput.value = '';
                    await loadComments(card, title, link);
                }
            } catch (e) {
                alert('留言失敗');
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.news-section').forEach(sec => sec.classList.remove('active'));
            
            el.classList.add('active');
            document.getElementById(tab + '-section').classList.add('active');
        }

        async function autoFillNickname() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.nickname) {
                document.querySelectorAll('.comment-username').forEach(input => {
                    input.value = user.nickname;
                    input.readOnly = true;
                });
            }
        }

        loadLikes().then(async () => {
            await Promise.all([loadTaiwanNews(), loadWorldNews()]);
            autoFillNickname();
        });
    </script>
</body>
</html>
