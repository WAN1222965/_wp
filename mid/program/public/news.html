<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="site_title_news">時事評論 - 墨</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Serif TC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        header {
            text-align: center;
            padding: 40px 0;
        }
        header h1 {
            font-size: 2.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        header .subtitle {
            color: #888;
            font-size: 0.9em;
            margin-top: 8px;
        }
        header a {
            color: #a0c4ff;
            text-decoration: none;
            font-size: 0.9em;
            display: inline-block;
            margin-top: 10px;
        }
        .news-nav { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:16px; }
        .news-nav a { padding:6px 16px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:20px; color:#ccc; text-decoration:none; font-size:0.85rem; transition:0.2s; }
        .news-nav a:hover { background:rgba(255,255,255,0.15); color:#fff; }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        .tab-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }
        .tab-btn:hover, .tab-btn.active {
            background: rgba(160, 196, 255, 0.3);
            border-color: #a0c4ff;
        }
        .news-section { display: none; }
        .news-section.active { display: block; }
        .write-btn-wrap { text-align: right; margin-bottom: 20px; }
        .write-btn {
            padding: 10px 24px;
            background: rgba(160, 196, 255, 0.2);
            border: 1px solid rgba(160, 196, 255, 0.4);
            color: #a0c4ff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
            font-family: inherit;
        }
        .write-btn:hover { background: rgba(160, 196, 255, 0.4); }
        .commentary-list { margin-top: 10px; }
        .commentary-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .commentary-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .card-headline {
            font-size: 1.5em;
            color: #ffd700;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .card-attribution {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .card-attribution .source-name { color: #a0c4ff; }
        .card-summary {
            font-size: 0.95em;
            color: #ccc;
            line-height: 1.7;
            margin-bottom: 12px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-left: 3px solid rgba(160, 196, 255, 0.3);
            border-radius: 0 6px 6px 0;
        }
        .card-summary-label {
            font-size: 0.8em;
            color: #888;
            display: block;
            margin-bottom: 4px;
        }
        .card-original-link {
            display: inline-block;
            margin-bottom: 15px;
            font-size: 0.9em;
        }
        .card-original-link a {
            color: #a0c4ff;
            text-decoration: none;
            transition: color 0.2s;
        }
        .card-original-link a:hover { color: #fff; text-decoration: underline; }
        .card-embed {
            margin-bottom: 15px;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
        }
        .card-embed iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .card-analysis {
            font-size: 0.95em;
            color: #ddd;
            line-height: 1.9;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        .card-analysis-label {
            font-size: 0.8em;
            color: #ffd700;
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .card-meta {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 15px;
        }
        .card-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .like-btn {
            background: rgba(255,100,100,0.2);
            border: 1px solid rgba(255,100,100,0.4);
            color: #ff6b6b;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: inherit;
        }
        .like-btn:hover { background: rgba(255,100,100,0.4); }
        .like-btn.liked { background: #ff6b6b; color: #fff; }
        .admin-controls {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }
        .edit-btn, .delete-btn {
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s;
            font-family: inherit;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #aaa;
        }
        .edit-btn:hover { background: rgba(160, 196, 255, 0.3); color: #a0c4ff; }
        .delete-btn:hover { background: rgba(255,100,100,0.3); color: #ff6b6b; }
        .comment-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .comment-form {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .comment-form input {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            color: #fff;
            font-size: 0.85em;
        }
        .comment-form input::placeholder { color: #666; }
        .comment-form button {
            padding: 8px 15px;
            background: rgba(160, 196, 255, 0.3);
            border: 1px solid rgba(160, 196, 255, 0.5);
            border-radius: 20px;
            color: #a0c4ff;
            cursor: pointer;
            font-family: inherit;
        }
        .comment-form button:hover { background: rgba(160, 196, 255, 0.5); }
        .comments-list { font-size: 0.85em; color: #aaa; }
        .comment-item {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-user { color: #a0c4ff; font-weight: bold; }
        .comment-time { color: #666; font-size: 0.8em; margin-left: 10px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            overflow-y: auto;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1e2a4a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 35px;
            max-width: 700px;
            width: 100%;
            position: relative;
        }
        .modal h2 {
            color: #ffd700;
            margin-bottom: 25px;
            font-size: 1.4em;
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            color: #888;
            font-size: 1.8em;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.2s;
        }
        .modal-close:hover { color: #fff; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            color: #aaa;
            font-size: 0.85em;
            margin-bottom: 6px;
        }
        .form-group label .hint {
            color: #666;
            font-size: 0.85em;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95em;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: #a0c4ff;
        }
        .form-group textarea { min-height: 120px; resize: vertical; }
        .form-group select option { background: #1a1a2e; color: #fff; }
        .form-submit {
            padding: 12px 30px;
            background: rgba(160, 196, 255, 0.3);
            border: 1px solid rgba(160, 196, 255, 0.5);
            color: #a0c4ff;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s;
            width: 100%;
        }
        .form-submit:hover { background: rgba(160, 196, 255, 0.5); }
        .loading { text-align: center; padding: 50px; color: #888; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state p { font-size: 1em; margin-bottom: 8px; }
        .empty-state .sub { font-size: 0.85em; }
        @media (max-width: 768px) {
            .tabs { flex-wrap: wrap; }
            .commentary-card { padding: 20px; }
            .modal { padding: 25px; }
            .card-headline { font-size: 1.2em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 data-i18n="news_title">墨・時事評論</h1>
            <div class="subtitle" data-i18n="news_subtitle">以專業視角解析新聞，在合理範圍內引用、評論</div>
            <nav class="news-nav">
    <a href="" class="news-nav-blog" data-i18n="news_nav_blog">📝 網誌</a>
    <a href="" class="news-nav-notes" data-i18n="news_nav_notes">✏️ 隨筆</a>
    <a href="" class="news-nav-snake" data-i18n="news_nav_snake">🐍 貪吃蛇</a>
    <a href="" class="news-nav-whack" data-i18n="news_nav_whack">🎯 捕墨</a>
    <a href="" class="news-nav-maze" data-i18n="news_nav_maze">🏃 墨陣</a>
    <a href="" class="news-nav-leaderboard" data-i18n="news_nav_leaderboard">🏆 排行</a>
            </nav>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('taiwan', this)" data-i18n="news_tab_taiwan">台灣新聞評論</button>
            <button class="tab-btn" onclick="switchTab('world', this)" data-i18n="news_tab_world">國際新聞評論</button>
        </div>

        <div id="taiwan-section" class="news-section active">
            <div id="taiwan-admin-bar" class="write-btn-wrap" style="display:none;">
                <button class="write-btn" onclick="openCreateModal('taiwan')" data-i18n="news_write_btn">✏️ 撰寫評論</button>
            </div>
            <div id="taiwan-list" class="commentary-list">
                <div class="loading" data-i18n="news_loading">載入中...</div>
            </div>
        </div>

        <div id="world-section" class="news-section">
            <div id="world-admin-bar" class="write-btn-wrap" style="display:none;">
                <button class="write-btn" onclick="openCreateModal('world')" data-i18n="news_write_btn">✏️ 撰寫評論</button>
            </div>
            <div id="world-list" class="commentary-list">
                <div class="loading" data-i18n="news_loading">載入中...</div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modal-title" data-i18n="news_modal_title">撰寫新聞評論</h2>
            <form id="commentary-form" onsubmit="submitForm(event)">
                <input type="hidden" id="form-id" value="">
                <input type="hidden" id="form-category" value="taiwan">

                <div class="form-group">
                    <label data-i18n="news_form_source_label">原始媒體名稱 <span class="hint" data-i18n="news_form_source_hint">（如：UDN 聯合報、BBC）</span></label>
                    <input type="text" id="form-source" placeholder="e.g. UDN 聯合報" required data-i18n="news_form_source_placeholder">
                </div>

                <div class="form-group">
                    <label data-i18n="news_form_orig_title_label">原始新聞標題</label>
                    <input type="text" id="form-original-title" placeholder="該新聞原本的標題" required data-i18n="news_form_orig_title_placeholder">
                </div>

                <div class="form-group">
                    <label data-i18n="news_form_orig_link_label">原始新聞連結</label>
                    <input type="url" id="form-original-link" placeholder="https://..." required data-i18n="news_form_orig_link_placeholder">
                </div>

                <div class="form-group">
                    <label data-i18n="news_form_headline_label">你的改寫標題 <span class="hint" data-i18n="news_form_headline_hint">（用你自己的話重新擬定）</span></label>
                    <input type="text" id="form-headline" placeholder="符合你網誌風格的標題" required data-i18n="news_form_headline_placeholder">
                </div>

                <div class="form-group">
                    <label data-i18n="news_form_summary_label">事件簡述 <span class="hint" data-i18n="news_form_summary_hint">（10-20%，用自己的話極簡短概括）</span></label>
                    <textarea id="form-summary" placeholder="時間、地點、發生了什麼事…" required data-i18n="news_form_summary_placeholder"></textarea>
                </div>

                <div class="form-group">
                    <label data-i18n="news_form_analysis_label">個人觀點與分析 <span class="hint" data-i18n="news_form_analysis_hint">（80%以上，這才是你的價值所在）</span></label>
                    <textarea id="form-analysis" placeholder="從你的專業角度深入分析…" required style="min-height:200px;" data-i18n="news_form_analysis_placeholder"></textarea>
                </div>

                <div class="form-group">
                    <label data-i18n="news_form_embed_label">嵌入影片網址 <span class="hint" data-i18n="news_form_embed_hint">（選填，YouTube 嵌入網址）</span></label>
                    <input type="url" id="form-embed" placeholder="https://www.youtube.com/embed/...">
                </div>

                <button type="submit" class="form-submit" data-i18n="news_form_submit">發佈評論</button>
            </form>
        </div>
    </div>

    <script src="" id="i18nScript"></script>
    <script>
        function __(key, fallback) { return (window.__i18nT && window.__i18nT[key]) || fallback; }
        let currentUser = null;
        try {
            const u = localStorage.getItem('user');
            if (u) currentUser = JSON.parse(u);
        } catch(e) {}

        function isLoggedIn() { return currentUser && currentUser.id; }

        function esc(v) {
            return (v || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function getEmbedId(url) {
            if (!url) return '';
            const m = url.match(/(?:youtube\.com\/embed\/|youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            return m ? m[1] : '';
        }

        const BASE = window.location.pathname.replace(/\/news.*$/, '') || '/s111410509';
        document.getElementById('i18nScript').src = BASE + '/i18n.js';

        document.querySelectorAll('.news-nav a').forEach(a => {
            const cls = Array.from(a.classList).find(c => c.startsWith('news-nav-'));
            if (cls) {
                const map = { 'news-nav-blog': '', 'news-nav-notes': 'notes', 'news-nav-snake': 'snake.html', 'news-nav-whack': 'whack.html', 'news-nav-maze': 'maze.html', 'news-nav-leaderboard': 'leaderboard.html' };
                a.href = BASE + '/' + (map[cls] || '');
            }
        });

        async function loadCommentary(category) {
            const list = document.getElementById(category + '-list');
            list.innerHTML = '<div class="loading" data-i18n="news_loading">' + __('news_loading', '載入中...') + '</div>';
            try {
                const res = await fetch(BASE + '/api/news/commentary/' + category);
                const posts = await res.json();
                if (posts.length === 0) {
                    list.innerHTML = '<div class="empty-state"><p data-i18n="news_empty">' + __('news_empty', '尚無評論文章') + '</p><div class="sub" data-i18n="news_empty_sub">' + __('news_empty_sub', '等待筆者撰寫深入分析…') + '</div></div>';
                    return;
                }
                list.innerHTML = '';
                for (const post of posts) {
                    const card = createCommentaryCard(post);
                    list.appendChild(card);
                }
            } catch (e) {
                list.innerHTML = '<div class="empty-state"><p>' + __('news_load_fail', '載入失敗') + '</p><div class="sub">' + esc(e.message) + '</div></div>';
            }
        }

        function createCommentaryCard(post) {
            const card = document.createElement('div');
            card.className = 'commentary-card';
            card.dataset.id = post.id;

            const embedId = getEmbedId(post.embed_url);
            var localeMap = { 'zh-TW': 'zh-TW', 'en': 'en-US', 'ja': 'ja-JP' };
            var locale = localeMap[window.__i18nLang] || 'zh-TW';
            const pubDate = new Date(post.created_at).toLocaleDateString(locale);

            let html = '';
            html += '<div class="card-headline">' + esc(post.rewritten_headline) + '</div>';
            html += '<div class="card-attribution">' + __('news_from', '原文出自') + ' <span class="source-name">' + esc(post.source_name) + '</span> ' + __('news_report', '報導') + '：<a href="' + esc(post.original_link) + '" target="_blank" style="color:#a0c4ff;">' + esc(post.original_title) + '</a></div>';
            html += '<div class="card-summary"><span class="card-summary-label">📌 ' + __('news_summary_label', '事件簡述') + '</span>' + esc(post.event_summary) + '</div>';
            html += '<div class="card-original-link">🔗 <a href="' + esc(post.original_link) + '" target="_blank">' + __('news_detail_link', '詳細案情可參考【') + esc(post.source_name) + __('news_report_link', '報導連結】') + '</a></div>';

            if (embedId) {
                html += '<div class="card-embed"><iframe src="https://www.youtube.com/embed/' + embedId + '" allowfullscreen></iframe></div>';
            }

            html += '<div class="card-analysis"><span class="card-analysis-label">💡 ' + __('news_analysis_label', '個人觀點與分析') + '</span>' + esc(post.analysis_content) + '</div>';
            html += '<div class="card-meta">🕒 ' + pubDate + '</div>';

            html += '<div class="card-actions">';
            html += '<button class="like-btn" data-id="' + post.id + '" data-title="' + esc(post.rewritten_headline) + '" data-link="' + esc(post.original_link) + '" onclick="toggleLike(this)">♡ <span class="like-count">0</span></button>';
            html += '<button class="like-btn" data-id="' + post.id + '" data-title="' + esc(post.rewritten_headline) + '" data-link="' + esc(post.original_link) + '" onclick="toggleComments(this)" style="background:rgba(160,196,255,0.2);border-color:rgba(160,196,255,0.4);color:#a0c4ff;">💬 <span class="comment-count">0</span></button>';

            if (isLoggedIn()) {
                html += '<div class="admin-controls">';
                html += '<button class="edit-btn" onclick="openEditModal(' + post.id + ')">✏️ ' + __('news_edit', '編輯') + '</button>';
                html += '<button class="delete-btn" onclick="deletePost(' + post.id + ')">🗑️ ' + __('news_delete', '刪除') + '</button>';
                html += '</div>';
            }

            html += '</div>';

            html += '<div class="comment-section" style="display:none;">';
            html += '<div class="comment-form">';
            html += '<input type="text" placeholder="' + __('news_comment_name', '暱稱') + '" class="comment-username">';
            html += '<input type="text" placeholder="' + __('news_comment_placeholder', '留言...') + '" class="comment-input">';
            html += '<button onclick="addComment(this)">' + __('news_comment_send', '發送') + '</button>';
            html += '</div>';
            html += '<div class="comments-list"></div>';
            html += '</div>';

            card.innerHTML = html;
            return card;
        }

        async function loadLikes() {
            try {
                const res = await fetch(BASE + '/api/news/likes');
                const likes = await res.json();
                likes.forEach(item => {
                    document.querySelectorAll('.like-btn[data-title="' + item.news_title.replace(/"/g, '&quot;') + '"]').forEach(btn => {
                        btn.querySelector('.like-count').textContent = item.likes;
                        if (item.likes > 0) btn.classList.add('liked');
                    });
                });
            } catch(e) { console.error(__('news_load_fail', '載入失敗'), e); }
        }

        async function toggleLike(btn) {
            const title = btn.getAttribute('data-title');
            const link = btn.getAttribute('data-link');
            try {
                const res = await fetch(BASE + '/api/news/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, link })
                });
                const data = await res.json();
                btn.classList.add('liked');
                btn.querySelector('.like-count').textContent = data.likes;
            } catch(e) { alert(__('news_like_fail', '按讚失敗')); }
        }

        function getTitle(btn) { return btn.getAttribute('data-title'); }
        function getLink(btn) { return btn.getAttribute('data-link'); }

        async function toggleComments(btn) {
            const card = btn.closest('.commentary-card');
            const section = card.querySelector('.comment-section');
            const title = getTitle(btn);
            const link = getLink(btn);
            if (section.style.display === 'none') {
                section.style.display = 'block';
                await loadComments(card, title, link);
            } else {
                section.style.display = 'none';
            }
        }

        async function loadComments(card, title, link) {
            const list = card.querySelector('.comments-list');
            const countSpan = card.querySelector('.comment-count');
            try {
                const res = await fetch(BASE + '/api/news/comments?title=' + encodeURIComponent(title));
                const comments = await res.json();
                countSpan.textContent = comments.length;
                list.innerHTML = comments.map(function(c) {
                    var localeMap = { 'zh-TW': 'zh-TW', 'en': 'en-US', 'ja': 'ja-JP' };
                    var l = localeMap[window.__i18nLang] || 'zh-TW';
                    return '<div class="comment-item"><span class="comment-user">' + esc(c.username) + '</span><span class="comment-time">' + new Date(c.created_at).toLocaleDateString(l) + '</span><div>' + esc(c.content) + '</div></div>';
                }).join('');
                if (comments.length === 0) list.innerHTML = '<div style="color:#666;">' + __('news_no_comments', '尚無留言') + '</div>';
            } catch(e) { list.innerHTML = '<div style="color:#ff6b6b;">' + __('news_load_fail', '載入失敗') + '</div>'; }
        }

        async function addComment(btn) {
            const card = btn.closest('.commentary-card');
            const usernameInput = card.querySelector('.comment-username');
            const contentInput = card.querySelector('.comment-input');
            const title = getTitle(btn);
            const link = getLink(btn);
            const username = usernameInput.value.trim();
            const content = contentInput.value.trim();
            if (!username || !content) { alert(__('news_comment_required', '請填寫暱稱和留言內容')); return; }
            try {
                const res = await fetch(BASE + '/api/news/comment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, link, username, content })
                });
                if (res.ok) {
                    contentInput.value = '';
                    await loadComments(card, title, link);
                }
            } catch(e) { alert(__('news_comment_fail', '留言失敗')); }
        }

        function autoFillNickname() {
            if (currentUser && currentUser.nickname) {
                document.querySelectorAll('.comment-username').forEach(input => {
                    input.value = currentUser.nickname;
                    input.readOnly = true;
                });
            }
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.news-section').forEach(s => s.classList.remove('active'));
            el.classList.add('active');
            document.getElementById(tab + '-section').classList.add('active');
        }

        function openCreateModal(category) {
            document.getElementById('modal-title').textContent = __('news_modal_title', '撰寫新聞評論');
            document.getElementById('form-id').value = '';
            document.getElementById('form-category').value = category;
            document.getElementById('commentary-form').reset();
            document.getElementById('modal-overlay').classList.add('show');
        }

        async function openEditModal(id) {
            const category = document.querySelector('.news-section.active').id.replace('-section', '');
            try {
                const res = await fetch(BASE + '/api/news/commentary/' + category);
                const posts = await res.json();
                const post = posts.find(p => p.id === id);
                if (!post) { alert(__('news_not_found', '找不到該文章')); return; }
 
                document.getElementById('modal-title').textContent = __('news_edit_title', '編輯評論');
                document.getElementById('form-id').value = post.id;
                document.getElementById('form-category').value = post.category;
                document.getElementById('form-source').value = post.source_name;
                document.getElementById('form-original-title').value = post.original_title;
                document.getElementById('form-original-link').value = post.original_link;
                document.getElementById('form-headline').value = post.rewritten_headline;
                document.getElementById('form-summary').value = post.event_summary;
                document.getElementById('form-analysis').value = post.analysis_content;
                document.getElementById('form-embed').value = post.embed_url || '';
                document.getElementById('modal-overlay').classList.add('show');
            } catch(e) { alert(__('news_load_fail', '載入失敗')); }
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        async function submitForm(e) {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const category = document.getElementById('form-category').value;
            const data = {
                category,
                source_name: document.getElementById('form-source').value.trim(),
                original_title: document.getElementById('form-original-title').value.trim(),
                original_link: document.getElementById('form-original-link').value.trim(),
                rewritten_headline: document.getElementById('form-headline').value.trim(),
                event_summary: document.getElementById('form-summary').value.trim(),
                analysis_content: document.getElementById('form-analysis').value.trim(),
                embed_url: document.getElementById('form-embed').value.trim()
            };

            try {
                const url = id ? BASE + '/api/news/commentary/' + id : BASE + '/api/news/commentary';
                const method = id ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert(__('news_op_fail', '操作失敗: ') + (err.error || ''));
                    return;
                }
                closeModal();
                await loadCommentary(category);
                await loadLikes();
                autoFillNickname();
            } catch(e) { alert(__('news_op_fail', '操作失敗: ') + e.message); }
        }

        async function deletePost(id) {
            if (!confirm(__('news_delete_confirm', '確定刪除此評論文章？'))) return;
            const category = document.querySelector('.news-section.active').id.replace('-section', '');
            try {
                const res = await fetch(BASE + '/api/news/commentary/' + id, { method: 'DELETE' });
                if (!res.ok) { alert(__('news_delete_fail', '刪除失敗')); return; }
                await loadCommentary(category);
            } catch(e) { alert(__('news_delete_fail', '刪除失敗')); }
        }

        async function init() {
            if (isLoggedIn()) {
                document.getElementById('taiwan-admin-bar').style.display = 'block';
                document.getElementById('world-admin-bar').style.display = 'block';
            }
            await Promise.all([loadCommentary('taiwan'), loadCommentary('world')]);
            await loadLikes();
            autoFillNickname();
        }

        init();
    </script>
</body>
</html>
