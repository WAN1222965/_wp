<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨 - 登入</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap">
    <script>
        const BASE = window.location.pathname.replace(/\/login.*$/, '') || '/s111410509';
    </script>
    <link rel="stylesheet" href="" id="styleLink">
    <style>
        .login-header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 30px;
        }

        .login-header .nav-links {
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <canvas id="inkCanvas"></canvas>

    <header class="login-header">
        <nav class="nav-links" id="loginNav">
            <a href="" class="nav-pill">📝 網誌</a>
            <a href="" class="nav-pill">🐍 貪吃蛇</a>
            <a href="" class="nav-pill">🎯 捕墨</a>
            <a href="" class="nav-pill">🏃 墨陣</a>
            <a href="" class="nav-pill">🏆 排行</a>
            <a href="" class="nav-pill">📰 新聞</a>
        </nav>
    </header>
    <script>
        document.getElementById('styleLink').href = BASE + '/style.css';
        document.querySelectorAll('#loginNav a').forEach((a, i) => {
            const paths = ['', 'snake.html', 'whack.html', 'maze.html', 'leaderboard.html', 'news.html'];
            a.href = BASE + '/' + paths[i];
        });
    </script>
    
    <div class="auth-container" id="loginForm">
        <h1>墨</h1>
        <p class="subtitle">落筆之前，先留名</p>
        <p class="error-msg" id="loginError"></p>
        <div class="form-group">
            <label>帳號</label>
            <input type="text" id="loginUsername" placeholder="輸入帳號">
        </div>
        <div class="form-group">
            <label>密碼</label>
            <input type="password" id="loginPassword" placeholder="輸入密碼">
        </div>
        <div class="btn-group">
            <button onclick="login()">登入</button>
            <button onclick="showRegister()">註冊</button>
        </div>
    </div>

    <div class="auth-container" id="registerForm" style="display:none;">
        <h1>墨</h1>
        <p class="subtitle">留下你的墨寶</p>
        <p class="error-msg" id="registerError"></p>
        <div class="form-group">
            <label>暱稱</label>
            <input type="text" id="regNickname" placeholder="設定暱稱">
        </div>
        <div class="form-group">
            <label>帳號</label>
            <input type="text" id="regUsername" placeholder="設定帳號">
        </div>
        <div class="form-group">
            <label>密碼</label>
            <input type="password" id="regPassword" placeholder="設定密碼">
        </div>
        <div class="btn-group">
            <button onclick="register()">註冊</button>
            <button onclick="showLogin()">返回登入</button>
        </div>
    </div>

    <script src="" id="inkScript"></script>
    <script>
        document.getElementById('inkScript').src = BASE + '/ink_background.js';
        
        (function() {
            const t = localStorage.getItem('theme');
            const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t || sys);
        })();

        let currentUser = null;
        try { currentUser = JSON.parse(localStorage.getItem('user')); } catch {}
        
        if (currentUser) {
            window.location.href = BASE + '/notes';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!username || !password) {
                document.getElementById('loginError').textContent = '請輸入帳號和密碼';
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            const res = await fetch(BASE + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('user', JSON.stringify(user));
                window.location.href = BASE + '/notes';
            } else {
                const err = await res.json();
                document.getElementById('loginError').textContent = err.error;
                document.getElementById('loginError').style.display = 'block';
            }
        }

        async function register() {
            const nickname = document.getElementById('regNickname').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            if (!username || !password) {
                document.getElementById('registerError').textContent = '請輸入帳號和密碼';
                document.getElementById('registerError').style.display = 'block';
                return;
            }

            const res = await fetch(BASE + '/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, nickname, password })
            });

            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('user', JSON.stringify(user));
                window.location.href = BASE + '/notes';
            } else {
                const err = await res.json();
                document.getElementById('registerError').textContent = err.error;
                document.getElementById('registerError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
