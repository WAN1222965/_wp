<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨 - 登入</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap">
    <script>
        const BASE = window.location.pathname.replace(/\/login.*$/, '') || '/s111410509';
    </script>
    <link rel="stylesheet" href="" id="styleLink">
    <style>
        .login-header {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 30px;
        }

        .login-header .nav-links {
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <canvas id="inkCanvas"></canvas>

    <header class="login-header">
        <nav class="nav-links" id="loginNav">
            <a href="" class="nav-pill">📝 網誌</a>
            <a href="" class="nav-pill">🐍 貪吃蛇</a>
            <a href="" class="nav-pill">🎯 捕墨</a>
            <a href="" class="nav-pill">🏃 墨陣</a>
            <a href="" class="nav-pill">🏆 排行</a>
            <a href="" class="nav-pill">📰 新聞</a>
        </nav>
    </header>
    <script>
        document.getElementById('styleLink').href = BASE + '/style.css';
        document.querySelectorAll('#loginNav a').forEach((a, i) => {
            const paths = ['', 'snake.html', 'whack.html', 'maze.html', 'leaderboard.html', 'news.html'];
            a.href = BASE + '/' + paths[i];
        });
    </script>
    
    <div id="authContainer">
        <div class="auth-container" id="loginForm">
            <h1>墨</h1>
            <p class="subtitle">落筆之前，先留名</p>
            <p class="error-msg" id="loginError"></p>
            <div class="form-group">
                <label>帳號</label>
                <input type="text" id="loginUsername" placeholder="輸入帳號">
            </div>
            <div class="form-group">
                <label>密碼</label>
                <input type="password" id="loginPassword" placeholder="輸入密碼">
            </div>
            <div class="btn-group">
                <button onclick="login()">登入</button>
                <button onclick="showRegister()">註冊</button>
            </div>
        </div>

        <div class="auth-container" id="registerForm" style="display:none;">
            <h1>墨</h1>
            <p class="subtitle">留下你的墨寶</p>
            <p class="error-msg" id="registerError"></p>
            <div class="form-group">
                <label>暱稱</label>
                <input type="text" id="regNickname" placeholder="設定暱稱">
            </div>
            <div class="form-group">
                <label>帳號</label>
                <input type="text" id="regUsername" placeholder="設定帳號">
            </div>
            <div class="form-group">
                <label>密碼</label>
                <input type="password" id="regPassword" placeholder="設定密碼">
            </div>
            <div class="btn-group">
                <button onclick="register()">註冊</button>
                <button onclick="showLogin()">返回登入</button>
            </div>
        </div>
    </div>

    <script>
        function loadScript(url) {
            var s = document.createElement('script');
            s.src = url;
            document.body.appendChild(s);
        }
        loadScript(BASE + '/ink_background.js');

        (function() {
            const t = localStorage.getItem('theme');
            const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t || sys);
        })();

    let currentUser = null;
    try { currentUser = JSON.parse(localStorage.getItem('user')); } catch {}

    function showToast(msg, type) {
      type = type || 'error';
      var t = document.createElement('div');
      t.textContent = msg;
      Object.assign(t.style, { position:'fixed', bottom:'24px', right:'24px', background: type === 'error' ? '#e53e3e' : 'var(--text)', color:'#fff', padding:'12px 20px', borderRadius:'8px', fontSize:'0.9rem', zIndex:'9999', boxShadow:'0 4px 20px rgba(0,0,0,0.2)', opacity:'0', transform:'translateY(10px)', transition:'0.3s', fontFamily:'inherit', maxWidth:'360px' });
      document.body.appendChild(t);
      requestAnimationFrame(function() { t.style.opacity = '1'; t.style.transform = 'translateY(0)'; });
      setTimeout(function() { t.style.opacity = '0'; t.style.transform = 'translateY(10px)'; setTimeout(function() { t.remove(); }, 300); }, 3000);
    }

    function doLogout() {
      fetch(BASE + '/api/auth/logout', { method: 'POST' }).catch(function() {}).finally(function() {
        localStorage.removeItem('user');
        window.location.reload();
      });
    }

    // Check session first
    fetch(BASE + '/api/auth/me').then(function(r) { return r.json(); }).then(function(d) {
      if (d.authenticated) {
        localStorage.setItem('user', JSON.stringify(d.user));
        currentUser = d.user;
        showLoggedIn(d.user);
      } else if (currentUser) {
        showLoggedIn(currentUser);
      }
    }).catch(function() {
      if (currentUser) showLoggedIn(currentUser);
    });

    function showLoggedIn(user) {
      document.getElementById('authContainer').innerHTML = `
        <div class="auth-container" style="text-align:center;">
          <h1>墨</h1>
          <p class="subtitle">你已登入為 <strong>${escapeHtml(user.nickname || user.username)}</strong></p>
          <div class="btn-group" style="justify-content:center;">
            <button onclick="window.location.href=BASE+'/notes'">前往隨筆</button>
            <button onclick="doLogout()" style="background:transparent;border:1px solid var(--border);">登出</button>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      var d = document.createElement('div');
      d.appendChild(document.createTextNode(str || ''));
      return d.innerHTML;
    }

    function showRegister() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'block';
    }

    function showLogin() {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
    }

    async function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const errEl = document.getElementById('loginError');

        if (!username || !password) {
            errEl.textContent = '請輸入帳號和密碼';
            errEl.style.display = 'block';
            return;
        }
        if (password.length < 6) {
            errEl.textContent = '密碼至少需要 6 個字元';
            errEl.style.display = 'block';
            return;
        }
        const btn = document.querySelector('#loginForm .btn-group button');
        btn.textContent = '登入中...';
        btn.disabled = true;
        try {
            const res = await fetch(BASE + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('user', JSON.stringify(user));
                showToast('登入成功！', 'success');
                setTimeout(function() { window.location.href = BASE + '/notes'; }, 500);
            } else {
                const err = await res.json();
                errEl.textContent = err.error || '登入失敗';
                errEl.style.display = 'block';
            }
        } catch {
            errEl.textContent = '網路錯誤，請稍後再試';
            errEl.style.display = 'block';
        }
        btn.textContent = '登入';
        btn.disabled = false;
    }

    async function register() {
        const nickname = document.getElementById('regNickname').value.trim();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const errEl = document.getElementById('registerError');

        if (!username || !password) {
            errEl.textContent = '請輸入帳號和密碼';
            errEl.style.display = 'block';
            return;
        }
        if (username.length < 3) {
            errEl.textContent = '帳號至少需要 3 個字元';
            errEl.style.display = 'block';
            return;
        }
        if (password.length < 6) {
            errEl.textContent = '密碼至少需要 6 個字元';
            errEl.style.display = 'block';
            return;
        }
        const btn = document.querySelector('#registerForm .btn-group button');
        btn.textContent = '註冊中...';
        btn.disabled = true;
        try {
            const res = await fetch(BASE + '/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, nickname, password })
            });
            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('user', JSON.stringify(user));
                showToast('註冊成功！', 'success');
                setTimeout(function() { window.location.href = BASE + '/notes'; }, 500);
            } else {
                const err = await res.json();
                errEl.textContent = err.error || '註冊失敗';
                errEl.style.display = 'block';
            }
        } catch {
            errEl.textContent = '網路錯誤，請稍後再試';
            errEl.style.display = 'block';
        }
        btn.textContent = '註冊';
        btn.disabled = false;
    }
    </script>
</body>
</html>
