<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨跡貪吃蛇</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --snake-bg: #0f172a;
            --snake-surface: rgba(255, 255, 255, 0.05);
            --snake-border: rgba(255, 255, 255, 0.1);
            --snake-accent: #38bdf8;
            --snake-accent-glow: rgba(56, 189, 248, 0.2);
            --snake-text: #e2e8f0;
            --snake-text-muted: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--snake-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Noto Serif TC', serif;
            color: var(--snake-text);
        }
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            max-width: 500px;
            width: 100%;
        }
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.6s ease;
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .game-header h1 {
            color: #fff;
            font-size: 2.8rem;
            letter-spacing: 16px;
            margin: 0;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.12);
            position: relative;
            display: inline-block;
        }
        .game-header h1::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 2px;
            background: var(--snake-accent);
            opacity: 0.5;
        }
        .score-board {
            font-size: 1.2rem;
            color: var(--snake-accent);
            margin-bottom: 16px;
            padding: 10px 28px;
            background: var(--snake-surface);
            border: 1px solid var(--snake-border);
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        .score-board strong { 
            font-size: 1.6rem;
            font-weight: 700;
        }
        #snakeGame {
            border: 2px solid var(--snake-border);
            box-shadow: 0 0 40px var(--snake-accent-glow);
            border-radius: 12px;
            max-width: 100%;
        }
        .hint {
            color: var(--snake-text-muted);
            font-size: 0.85rem;
            margin-top: 12px;
            letter-spacing: 1px;
        }
        .nav-links {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border: 1px solid var(--snake-border);
            border-radius: 50px;
            text-decoration: none;
            color: var(--snake-text-muted);
            font-size: 0.84rem;
            background: var(--snake-surface);
            transition: all 0.25s ease;
        }
        .nav-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: translateY(-2px);
        }
        .theme-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 50;
            background: var(--snake-surface);
            border: 1px solid var(--snake-border);
            color: var(--snake-text-muted);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.25s ease;
        }
        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 深色</button>

    <div class="game-area">
        <header class="game-header">
            <h1>墨跡</h1>
        </header>

        <div class="score-board">
            得分：<strong id="scoreVal">0</strong>
        </div>

        <canvas id="snakeGame" width="400" height="400"></canvas>

        <div class="hint">方向鍵控制方向 · 撞到自己則結束</div>

        <nav class="nav-links">
            <a href="/s111410509/" class="nav-pill">📝 網誌</a>
            <a href="/s111410509/notes" class="nav-pill">✏️ 隨筆</a>
            <a href="/s111410509/whack.html" class="nav-pill">🎯 捕墨</a>
            <a href="/s111410509/maze.html" class="nav-pill">🏃 墨陣</a>
            <a href="/s111410509/leaderboard.html" class="nav-pill">🏆 排行</a>
            <a href="/s111410509/news.html" class="nav-pill">📰 新聞</a>
        </nav>
    </div>

    <script src="/s111410509/ink_background.js"></script>
    <script>
        (function() {
            const t = localStorage.getItem('theme');
            const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const theme = t || sys;
            document.documentElement.setAttribute('data-theme', theme);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = theme === 'dark' ? '☀️ 淺色' : '🌙 深色';
        })();
        window.toggleTheme = function() {
            const c = document.documentElement.getAttribute('data-theme');
            const t = c === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            const btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = t === 'dark' ? '☀️ 淺色' : '🌙 深色';
        };
    </script>
    <script src="/s111410509/snake.js"></script>
</body>
</html>
